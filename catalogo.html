<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--ink:#222;--mut:#777;--acc:#b5446e}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a1c;--card:#27252a;--ink:#eee;--mut:#aaa;--acc:#e07aa0}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px;position:sticky;top:0;background:var(--bg);z-index:2;display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:10px;border-radius:8px;border:1px solid #8884;background:var(--card);color:var(--ink);font-size:16px}
input{flex:1;min-width:180px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:0 16px 24px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0002}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#8882}
.card div{padding:10px}.n{font-weight:600;font-size:14px}.p{color:var(--acc);font-weight:700;margin-top:4px}.c{color:var(--mut);font-size:12px}
</style></head><body>

const $ = id => document.getElementById(id);
const cats = [...new Set(PRODUCTOS.map(p => p.categoria).filter(Boolean))].sort();
cats.forEach(c => $("cat").add(new Option(c, c)));
const clp = n => n == null ? "" : "$" + n.toLocaleString("es-CL");
function pintar() {
  const q = $("q").value.toLowerCase(), c = $("cat").value;
  $("lista").innerHTML = PRODUCTOS
    .filter(p => (!c || p.categoria === c) && (p.nombre + " " + p.codigo).toLowerCase().includes(q))
    .map(p => `<div class="card"><img loading="lazy" src="${p.fotos[0]}" alt="${p.nombre}">
      <div><div class="n">${p.nombre}</div><div class="p">${clp(p.precio)}</div>
      <div class="c">Cód. ${p.codigo || "—"} · ${p.categoria}</div></div></div>`).join("");
}
$("q").oninput = pintar; $("cat").onchange = pintar; pintar();
</script></body></html>
