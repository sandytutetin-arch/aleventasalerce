<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ale Ventas Alerce</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff7fa;
    color: #333;
}

header {
    background: linear-gradient(135deg, #f7a9c4, #ffd3e1);
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 38px;
    color: #7a2848;
}

header p {
    margin: 10px 0 0;
    color: #633647;
}

nav {
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

nav a {
    color: #a73e67;
    text-decoration: none;
    font-weight: bold;
    margin: 0 12px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

.intro {
    text-align: center;
    margin-bottom: 30px;
}

.intro h2 {
    color: #a73e67;
}

.filtros {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.filtros input,
.filtros select {
    flex: 1;
    min-width: 220px;
    padding: 13px;
    border: 1px solid #e6b8c8;
    border-radius: 10px;
    background: white;
    font-size: 15px;
}

#contador {
    margin-bottom: 20px;
    color: #777;
}

#productos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.producto {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(0,0,0,.09);
    padding-bottom: 18px;
}

.contenedor-foto {
    position: relative;
    height: 240px;
    background: #f7edf1;
}

.foto-producto {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.foto-referencial {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(255,255,255,.9);
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 11px;
    color: #666;
}

.sin-foto {
    height: 170px;
    background: linear-gradient(135deg, #ffe2ec, #fff3f7);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #a85b77;
    padding: 20px;
}

.contenido {
    padding: 16px 16px 0;
}

.categoria {
    color: #b34d75;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.producto h3 {
    margin: 0 0 10px;
    font-size: 18px;
}

.precio {
    font-size: 22px;
    font-weight: bold;
    color: #b52e63;
    margin-bottom: 8px;
}

.stock {
    font-size: 14px;
    margin-bottom: 8px;
}

.detalle {
    font-size: 13px;
    color: #666;
    min-height: 35px;
    white-space: pre-line;
}

.boton {
    display: block;
    margin-top: 15px;
    background: #25D366;
    color: white;
    padding: 11px;
    border-radius: 9px;
    text-decoration: none;
    text-align: center;
    font-weight: bold;
}

.boton:hover {
    opacity: .9;
}

footer {
    margin-top: 45px;
    padding: 30px 20px;
    text-align: center;
    background: #7a2848;
    color: white;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 30px;
    }

    #productos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    main {
        padding: 20px 10px;
    }

    .contenedor-foto {
        height: 190px;
    }

    .contenido {
        padding: 12px 10px 0;
    }

    .producto h3 {
        font-size: 15px;
    }

    .precio {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header id="inicio">
    <h1>Ale Ventas Alerce</h1>
    <p>Encuentra ropa y productos disponibles para ti</p>
</header>

<nav>
    <a href="#inicio">Inicio</a>
    <a href="#catalogo">Catálogo</a>
    <a href="#contacto">Contacto</a>
</nav>

<main>

<section class="intro">
    <h2 id="catalogo">Catálogo</h2>
    <p>Revisa nuestros productos y consulta disponibilidad directamente por WhatsApp.</p>
</section>

<div class="filtros">
    <input
        id="buscar"
        type="search"
        placeholder="Buscar producto..."
    >

    <select id="filtroCategoria">
        <option value="">Todas las categorías</option>
    </select>
</div>

<div id="contador"></div>

<section id="productos"></section>

</main>

<footer id="contacto">
    <strong>Ale Ventas Alerce</strong>
    <p>Consultas y pedidos por WhatsApp: +56 9 5044 6613</p>
    <small>© 2026 Ale Ventas Alerce</small>
</footer>


<script src="inventario.js"></script>

<script>
const buscador = document.getElementById("buscar");
const filtroCategoria = document.getElementById("filtroCategoria");
const contenedor = document.getElementById("productos");
const contador = document.getElementById("contador");


/*
FOTOS REALES QUE YA EXISTEN EN LA CARPETA IMG.

Son imágenes referenciales: no afirmamos que correspondan
al modelo exacto del producto.
*/
function obtenerFotoReferencial(producto) {

    const texto = (
        String(producto.nombre || "") + " " +
        String(producto.categoria || "")
    ).toLowerCase();

    if (texto.includes("panty efecto piel")) {
        return "img/panty_piel.png";
    }

    if (texto.includes("jeans flare")) {
        return "img/jeans_flare_azul.png";
    }

    if (texto.includes("jeans")) {
        return "img/jeans_azul_claro.png";
    }

    if (
        texto.includes("cotele") &&
        texto.includes("pantal")
    ) {
        return "img/Cotele_pantalón.png";
    }

    if (
        texto.includes("flare") ||
        texto.includes("cargo")
    ) {
        return "img/Flare_cargo.png";
    }

    if (
        texto.includes("buzo") ||
        texto.includes("polar")
    ) {
        return "img/buzo_rosa.png";
    }

    if (texto.includes("conjunto")) {
        return "img/conjunto_polar.png";
    }

    return null;
}


function formatoPrecio(valor) {

    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
        return "";
    }

    return numero.toLocaleString(
        "es-CL",
        {
            style: "currency",
            currency: "CLP",
            maximumFractionDigits: 0
        }
    );
}


function cargarCategorias() {

    const categorias = [
        ...new Set(
            inventario
                .map(producto => producto.categoria)
                .filter(Boolean)
        )
    ].sort((a,b) =>
        String(a).localeCompare(String(b), "es")
    );

    categorias.forEach(categoria => {

        const opcion = document.createElement("option");

        opcion.value = categoria;
        opcion.textContent = categoria;

        filtroCategoria.appendChild(opcion);
    });
}


function mostrarProductos() {

    const texto = buscador.value
        .toLowerCase()
        .trim();

    const categoriaElegida =
        filtroCategoria.value;

    const resultados = inventario.filter(producto => {

        const nombre =
            String(producto.nombre || "")
            .toLowerCase();

        const notas =
            String(producto.notas || "")
            .toLowerCase();

        const coincideTexto =
            nombre.includes(texto) ||
            notas.includes(texto);

        const coincideCategoria =
            categoriaElegida === "" ||
            producto.categoria === categoriaElegida;

        return coincideTexto && coincideCategoria;
    });


    contador.textContent =
        resultados.length +
        " productos encontrados";


    contenedor.innerHTML = "";


    resultados.forEach(producto => {

        const foto =
            obtenerFotoReferencial(producto);

        const mensaje =
            encodeURIComponent(
                "Hola, quisiera consultar por " +
                producto.nombre +
                ". ¿Está disponible?"
            );


        const tarjeta =
            document.createElement("article");

        tarjeta.className = "producto";


        const bloqueFoto = foto
            ? `
                <div class="contenedor-foto">
                    <img
                        src="${foto}"
                        alt="Imagen referencial de ${producto.nombre}"
                        class="foto-producto"
                        loading="lazy"
                    >
                    <span class="foto-referencial">
                        Foto referencial
                    </span>
                </div>
              `
            : `
                <div class="sin-foto">
                    Producto disponible
                </div>
              `;


        tarjeta.innerHTML = `
            ${bloqueFoto}

            <div class="contenido">

                <div class="categoria">
                    ${producto.categoria || ""}
                </div>

                <h3>
                    ${producto.nombre || ""}
                </h3>

                <div class="precio">
                    ${formatoPrecio(producto.precio)}
                </div>

                <div class="stock">
                    Stock: ${producto.stock ?? ""}
                </div>

                <div class="detalle">
                    ${producto.notas || ""}
                </div>

                <a
                    class="boton"
                    target="_blank"
                    rel="noopener noreferrer"
                    href="https://wa.me/56950446613?text=${mensaje}"
                >
                    Consultar por WhatsApp
                </a>

            </div>
        `;

        contenedor.appendChild(tarjeta);
    });
}


cargarCategorias();
mostrarProductos();


buscador.addEventListener(
    "input",
    mostrarProductos
);


filtroCategoria.addEventListener(
    "change",
    mostrarProductos
);
</script>

</body>
</html>
